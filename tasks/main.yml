---
- name: Ensure malcolm public key is present
  ansible.builtin.authorized_key:
    user: "{{ user }}"
    key: "{{ lookup('file', 'malcolm.pub') }}"

- name: Create passwordless sudoers file for malcolm
  ansible.builtin.copy:
    dest: /etc/sudoers.d/malcolm
    content: "malcolm ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'